
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First CSS Page</title>

    <style>
        /* Styling the whole page */
        body {
            background-color: rgb(5, 227, 243);
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        /* Styling the heading */
        h1 {
            color: blue;
            text-align: center;
        }

        /* Styling the paragraph */
        p {
            color: green;
            font-size: 18px;
            padding: 10px;
            border: 2px solid black;
        }

        /* Styling a button */
        button {
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
        }
        
        /* styling a table */
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        
        }
        /* styling the table header */
        th {
            background-color: lightblue;
        }
        /* styling the table rows */
    
        tr:nth-child(even) {
            background-color: lightgray
        }
        /* styling the form */
        form {
            margin-top: 20px;
        }
    </style>
    
</head>

<body>

    <h1>My First Website</h1>

    <p>Hello opinion on the topic is that is very safe and effective for learning programming.</p>
    <table>
  <tr>
    <th>Name</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Austine</td>
    <td>19</td>
  </tr>
</table>

<form>
  <label for="name">Name:</label>
  <input type="text" id="name">

  <br><br>

  <label for="email">Email:</label>
  <input type="email" id="email">

  <br><br>

  <button type="submit">Submit</button>
</form>


    <button>Click Me</button>

</body>
</html>
